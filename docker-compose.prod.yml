version: "3.9"

services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio-data:/data
      - ./certs/minio:/root/.minio/certs
  db:
    networks:
      - dobrinya-network
    env_file:
      - .env
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  backend:
    networks:
      - dobrinya-network
    read_only: true
    env_file:
      - .env
    tmpfs:
      - /tmp
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    depends_on:
      - db
    volumes:
      - ./src:/app
      - ./src/static:/app/static
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8000:8000"
    entrypoint: ["/entrypoint_prod.sh"]
  nginx:
    networks:
      - dobrinya-network
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./src/static:/app/static
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  postgres_data:

networks:
  dobrinya-network:
    external: true