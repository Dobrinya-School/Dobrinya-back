name: Django CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python src/manage.py test

      - name: Protect Dockerfile.prod
        run: |
          git diff origin/main -- docker/Dockerfile.prod
          if [ $? -eq 0 ]; then
            echo "Dockerfile.prod изменён! PR запрещён."
            exit 1
          fi
