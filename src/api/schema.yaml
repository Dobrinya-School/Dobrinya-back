components:
  schemas:
    PublicUserData:
      type: object
      properties:
        user:
          type: string
          format: uuid
        first_name:
          type: string
          example: Иван
        last_name:
          type: string
          example: Иванов
        patronymic:
          type: string
          example: Иванович
        avatar_url:
          type: string
        timezone:
          type: string
          example: America/New_York
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        detail:
          type: string
    OkResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        detail:
          type: string


    LoginEmailVerification:
      type: object
      properties:
        status:
          type: string
          enum: [email_verification_required]
        detail:
          type: string
    LoginAdditionalVerification:
      type: object
      properties:
        status:
          type: string
          enum: [additional_verification_required]
        detail:
          type: string
        login_session:
          type: string
        variants:
          type: array
          items:
            type: string


    StudentData:
      type: object
      properties:
        user:
          type: string
          format: uuid
        school_name:
          type: string
          example: "Школа №1"
        school_class:
          type: string
          example: "1-А"
    TeacherData:
      type: object
      properties:
        user:
          type: string
          format: uuid
        school_name:
          type: string
          example: "Школа №1"
        qualifications:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
        subjects:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
    StudentUserData:
      allOf:
        - $ref: '#/components/schemas/PublicUserData'
        - $ref: '#/components/schemas/StudentData'
    TeacherUserData:
      allOf:
        - $ref: '#/components/schemas/PublicUserData'
        - $ref: '#/components/schemas/TeacherData'

    TaskData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Задание 1
        questions:
          type: array
          items:
            type: string
            format: uuid
    QuestionData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Вопрос 1
        answers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              text:
                type: string
                example: Ответ 1
              is_correct:
                type: boolean
    LectionData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        course:
          type: string
        name:
          type: string
        text:
          type: string
        resources:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              alt:
                type: string

    LessonData:
      type: object
      properties:
        course:
          type: object
          properties:
            name:
              type: string
              example: Математика
            teacher:
              $ref: '#/components/schemas/TeacherUserData'
        date:
          type: string
          format: date
        topic:
          type: string
        homework:
          type: object
          properties:
            text:
              type: string
            resources:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                  alt:
                    type: string
    LessonGradesData:
      type: object
      properties:
        grades:
          type: array
          items:
            type: object
            properties:
              student:
                $ref: '#/components/schemas/StudentUserData'
              grade:
                type: string
              grade_type:
                type: string
                enum: [lesson, exam, homework]
              comment:
                type: string

